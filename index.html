<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BOGO Offer</title>
  <link rel="stylesheet" href="task1.css">
</head>
<body>
  <div class="bg-container">

    <div class="line-container">
      <hr class="line"><span class="center-text">Yah! It's BOGO</span><hr class="line">
    </div>

    <!-- Option 1 -->
    <div class="radio-card">
      <input type="radio" name="productOption" id="option1" />
      <label for="option1" class="radio-label">
        <div class="header">
          <div class="title">
            <strong>1 Unit  </strong>
            <span class="discount">10% Off</span>
          </div>
          
          <div class="price">
            <span class="new-price">$10.00 USD</span><br>
            <span class="old-price">$15.00 USD</span>
          </div>
        </div>
        <strong>Standard Price</strong>
        <div class="options" id="option1-details">
          <div class="option-row">
            <span>#1</span>
            <select><option>S</option><option>M</option><option>L</option></select>
            <select><option>Colour</option><option>Black</option><option>White</option></select>
          </div>
        </div>
      </label>
    </div>

    <!-- Option 2 -->
    <div class="radio-card">
      <input type="radio" name="productOption" id="option2" />
      <label for="option2" class="radio-label">
        <div class="ribbon">MOST POPULAR</div>
        <div class="header">
          <div class="title">
            <strong>2 Unit</strong>
            <span class="discount">20% Off</span>
          </div>
          <div class="price">
            <span class="new-price">$18.00 USD</span><br>
            <span class="old-price">$24.00 USD</span>
          </div>
        </div>
        <div class="options" id="option2-details">
          <div class="option-row">
            <span>#1</span>
            <select><option>S</option><option>M</option><option>L</option></select>
            <select><option>Black</option><option>White</option></select>
          </div>
          <div class="option-row">
            <span>#2</span>
            <select><option>S</option><option>M</option><option>L</option></select>
            <select><option>Colour</option><option>Black</option><option>White</option></select>
          </div>
        </div>
      </label>
    </div>

    <!-- Option 3 -->
    <div class="radio-card">
      <input type="radio" name="productOption" id="option3" />
      <label for="option3" class="radio-label">
        <div class="header">
          <div class="title">
            <strong>3 Unit</strong>
            <span class="discount">30% Off</span>
          </div>
          <div class="price">
            <span class="new-price">$25.00 USD</span><br>
            <span class="old-price">$30.00 USD</span>
          </div>
        </div>
        <div class="options" id="option3-details">
          <div class="option-row">
            <span>#1</span>
            <select><option>S</option><option>M</option><option>L</option></select>
            <select><option>Colour</option><option>Black</option><option>White</option></select>
          </div>
          <div class="option-row">
            <span>#2</span>
            <select><option>S</option><option>M</option><option>L</option></select>
            <select><option>Colour</option><option>Black</option><option>White</option></select>
          </div>
          <div class="option-row">
            <span>#3</span>
            <select><option>S</option><option>M</option><option>L</option></select>
            <select><option>Colour</option><option>Black</option><option>White</option></select>
          </div>
        </div>
      </label>
    </div>
    <div class="summary-section" id="summary">
      <div class="delivery-total"> 
        <span class="free-delivery">Free Delivery</span>
        <span class="total-price" id="totalPrice">Total: $0.00</span>
      </div>
      <button class="add-button">Add to Cart</button>
    </div>
    
  </div>

  <script src="task1.js"></script>
</body>
</html>
